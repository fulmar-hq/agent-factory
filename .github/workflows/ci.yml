name: CI
on:
  push:
    branches: [main, QA]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Bun 1.3.14
        run: |
          curl --fail --silent --show-error --location --output bun.zip https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-linux-x64.zip
          echo '951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f  bun.zip' | sha256sum --check
          unzip -q bun.zip -d "$RUNNER_TEMP/factory-bun"
          echo "$RUNNER_TEMP/factory-bun/bun-linux-x64" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
