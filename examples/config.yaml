# Fictional installation. Store a private copy outside the checkout.
timezone: America/Toronto
schedule: {qa_window: '20:00', production_window: '21:30', missed_window: next_day}
owners:
  builder: {harness: codex, model: gpt-6.1-sol, effort: medium}
usage_gates: {admit_below: 0.70, high_benefit_only_below: 0.90, stop_at: 0.90, max_meter_age_minutes: 15}
usage_windows: {rule: "gate on every window the provider actually exposes; require at least one fresh native window (<= max age); 70/90% thresholds apply to each exposed window; missing data = refuse"}
overrun: {checkpoint_at: 1.8, pause_at: 2.0}
capacity: {start_parallel: 2, heavy_test_slots: 1}
wallet:
  aws: {ceiling_usd_month: 75, reserve_usd: 15, hold_at_projected: 60, stop_at_actual: 65}
  other: {default_usd: 0}
projects:
  demo: {repo: example/demo, owners: [builder], tests: bun test}

ticket_budget_default: {estimate_tokens: 8000000, checkpoint_tokens: 14400000, pause_tokens: 16000000, estimate_minutes: 30, checkpoint_minutes: 54, pause_minutes: 60}

# Opt in only after reviewing the structured owner-result contract.
autonomy:
  intake_mode: drain # build permits new product scope after deliberate reprioritization
  intake_owner: builder
  ready_buffer: 3
  auto_approval:
    max_minutes: 30
    max_docs_per_round: 1
    protected_paths: [AGENTS.md, CLAUDE.md, .github, launcher/config.ts, adapters/workers.ts, adapters/delivery.ts, scripts/control.ts, wallet]
  restart: {max_retries: 1, causes_per_hour: 3}
