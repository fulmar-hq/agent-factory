<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Factory Desk</title
  ><link rel="stylesheet" href="/style.css" />
  <script src="/app.js" defer></script>
  <body>
    <header>
      <div>
        <p class="eyebrow">LOCAL · FACTORY DESK</p>
        <h1 id="title">Today</h1>
      </div>
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="fr">Français</option>
      </select>
    </header>
    <main>
      <p id="connection" role="status">Loading local evidence…</p>
      <section id="summary" class="grid" aria-live="polite"></section>
      <section>
        <h2 id="control-title">Controls</h2>
        <form id="auth">
          <label for="token" id="token-label">Owner token</label
          ><input type="password" id="token" autocomplete="off" /><button
            id="save"
            type="submit"
          >
            Use token
          </button>
        </form>
        <p id="auth-result" role="status"></p>
        <button id="pause">Pause</button>
      </section>
      <section>
        <h2 id="questions-title">Questions</h2>
        <div id="questions"></div>
        <details><summary id="owner-questions-title">Questions for owners</summary><div id="owner-questions"></div></details>
        <details><summary id="resolved-questions-title">Resolved without you</summary><div id="resolved-questions"></div></details>
      </section>
      <section>
        <h2 id="tickets-title">Tickets</h2>
        <div id="tickets"></div>
      </section>
      <section>
        <h2 id="sessions-title">Sessions</h2>
        <div id="sessions"></div>
      </section>
      <section>
        <h2 id="releases-title">Releases</h2>
        <div id="releases"></div>
      </section>
      <section>
        <h2 id="owners-title">Owners</h2>
        <div id="owners"></div>
      </section>
      <footer id="sources"></footer>
    </main>
  </body>
</html>
