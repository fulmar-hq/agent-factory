<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Factory Desk</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><a class="skip" id="skip" href="#app">Skip to tasks</a>
<div class="wrap">
  <header class="top">
    <div class="brand">Factory Desk</div>
    <div class="top-right">
      <span class="updated" id="updated"></span>
      <div class="seg" role="group" aria-label="Language" id="lang">
        <button type="button" id="lang-en" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" id="lang-fr" data-lang="fr" aria-pressed="false">FR</button>
      </div>
    </div>
  </header>

  <main id="app"><p class="quiet-line">Checking the factory…</p></main><p id="connection" class="notice" role="status" hidden></p>
<details class="legend" id="legend"><summary id="legend-sum"></summary><ul id="legend-list"></ul></details>
<details id="controls" hidden><summary id="control-title">Local controls</summary><form id="auth"><label for="token" id="token-label">Owner token</label><input type="password" id="token" autocomplete="off" required><button type="submit" class="btn" id="save">Use token</button></form><p id="auth-result" role="status"></p><button type="button" class="btn" id="pause">Pause</button></details>

</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" inert>
  <div class="sheet-grab" aria-hidden="true"></div>
  <div class="sheet-bar">
    <button type="button" class="close" id="sheet-close">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="sheet-scroll" id="sheet-body"></div>
</div>

</body></html>
